[project]
name = "confluence-reader"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Anay Sahu", email = "pinganay@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "atlassian-python-api>=3.41,<4",
    "chromadb>=1.5.9",
    "ipykernel>=7.4.0",
    "langchain>=1.5.2",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-experimental>=0.4.2",
    "langchain-groq>=1.2.1",
    "langchain-huggingface>=1.2.3",
    "langchain-openai>=1.8.5",
    "langchain-text-splitters>=1.1.3",
    "pandas>=3.1.1",
    "pymupdf>=2.1",
    "pypdf>=7.1.1",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.3.0",
    "tiktoken>=0.14.0",
    "tqdm>=4.70.1",
]

[project.scripts]
confluence-reader = "confluence_reader:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
